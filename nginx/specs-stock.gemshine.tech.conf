# ==============================================================================
# Nginx Configuration for: specs-stock.gemshine.tech
# Frontend Root: /var/www/specs-stock/dist
# Backend Reverse Proxy: http://127.0.0.1:5028
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name specs-stock.gemshine.tech;

    # Allow Let's Encrypt ACME challenge verification for SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Frontend Static Files (Built with npm run build)
    root /var/www/specs-stock/dist;
    index index.html;

    # Gzip Compression for fast loading
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # Client body limit
    client_max_body_size 25M;

    # API Backend Reverse Proxy (Node Express on Port 5028)
    location /api/ {
        proxy_pass http://127.0.0.1:5028;
        proxy_http_version 1.1;

        # WebSocket & Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Real Client IP and Host headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static Assets Cache (Hashed Vite files)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA Client-Side Routing Fallback (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

