# ==============================================================================
# Nginx Configuration for: specs-stock.gemshine.tech
# Frontend Root: /var/www/specs-with-stock/dist
# Backend Reverse Proxy: http://127.0.0.1:5028
# ==============================================================================

# HTTP - Redirect all traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name specs-stock.gemshine.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    return 301 https://$host$request_uri;
}

# HTTPS - Production Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name specs-stock.gemshine.tech;

    # SSL Certificates (Issued by Certbot)
    ssl_certificate /etc/letsencrypt/live/specs-stock.gemshine.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/specs-stock.gemshine.tech/privkey.pem;

    # Frontend Static Files
    root /var/www/specs-with-stock/dist;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    client_max_body_size 25M;

    # API Backend Reverse Proxy (Port 5028)
    location /api/ {
        proxy_pass http://127.0.0.1:5028;
        proxy_http_version 1.1;

        # WebSocket & Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Real Client IP and Host headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static Assets Cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
