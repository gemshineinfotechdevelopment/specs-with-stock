# ==============================================================================
# Nginx Configuration for: specs-billing.gemshine.tech
# Frontend Root: /var/www/specs-billing/dist
# Backend Reverse Proxy: http://127.0.0.1:5026
# ==============================================================================

# HTTP - Redirect all traffic to HTTPS (Certbot will manage SSL certificates)
server {
    listen 80;
    listen [::]:80;
    server_name specs-billing.gemshine.tech;

    # Allow Let's Encrypt ACME challenge verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to HTTPS once SSL certificate is installed
    # (Uncomment the line below if certbot doesn't do it automatically)
    # return 301 https://$host$request_uri;

    # --- Initial HTTP Block (Active before SSL is installed) ---
    root /var/www/specs-billing/dist;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # Client body limit (Supports eyewear camera photos & base64 attachments)
    client_max_body_size 25M;

    # API Backend Reverse Proxy (Port 5026)
    location /api/ {
        proxy_pass http://127.0.0.1:5026;
        proxy_http_version 1.1;

        # WebSocket & Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Real Client IP and Host headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static Assets Cache (Vite builds hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA Client-Side Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

